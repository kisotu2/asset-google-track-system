<!DOCTYPE html>
<html>
<head>
    <title>IRA Laptop Asset System</title>
    <style>
        :root {
            --ira-brown: #b08116;
            --ira-green: #99bb4f;
            --ira-light: #f5f5f5;
        }

        body { margin:0; font-family:Segoe UI; background:var(--ira-light); }

        header {
            background:var(--ira-brown);
            color:white;
            padding:1rem 2rem;
            display:flex;
            justify-content:space-between;
        }

        nav a {
            color:white;
            margin-left:1rem;
            text-decoration:none;
        }

        .container { padding:2rem; }

        table {
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th, td {
            padding:0.8rem;
            border:1px solid #ddd;
        }

        th { background:var(--ira-brown); color:white; }

        button {
            background:var(--ira-green);
            color:white;
            border:none;
            padding:0.5rem 1rem;
            cursor:pointer;
        }

        .flash-success { color:green; }
        .flash-error { color:red; }
    </style>
</head>
<body>

<header>
    <h2>IRA Laptop Asset Management</h2>
    <nav>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/admin">Admin</a>
    </nav>
</header>

<div class="container">

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <p class="flash-{{category}}">{{ message }}</p>
    {% endfor %}
{% endwith %}

{% block content %}{% endblock %}

</div>
</body>
</html>

{% extends "base.html" %}
{% block content %}

<h2>Registered Laptops</h2>

<a href="/admin/add"><button>Add Laptop</button></a>

<table>
<tr>
    <th>Asset Tag</th>
    <th>Brand</th>
    <th>Model</th>
    <th>Department</th>
    <th>Status</th>
    <th>Actions</th>
</tr>

{% for laptop in laptops %}
<tr>
    <td>{{ laptop.asset_tag }}</td>
    <td>{{ laptop.brand }}</td>
    <td>{{ laptop.model }}</td>
    <td>{{ laptop.department }}</td>
    <td>{{ laptop.status }}</td>
    <td>
        <a href="/admin/edit/{{ laptop.id }}">Edit</a> |
        <a href="/admin/delete/{{ laptop.id }}" style="color:red;">Delete</a>
    </td>
</tr>
{% endfor %}

</table>

{% endblock %}
